name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build, test, and upload cs2rs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Upload cs2rs
        uses: actions/upload-artifact@v7
        with:
          name: cs2rs-linux
          path: target/release/cs2rs
          if-no-files-found: error
