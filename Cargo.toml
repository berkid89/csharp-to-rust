[package]
name = "csharp-to-rust"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Transpile a small subset of C# into equivalent Rust."
readme = "README.md"
repository = "https://github.com/berkid89/csharp-to-rust"
documentation = "https://docs.rs/csharp-to-rust"
homepage = "https://github.com/berkid89/csharp-to-rust"
authors = ["Daniel Berki <berkid89@gmail.com>"]
keywords = ["csharp", "transpiler", "codegen", "source-to-source"]
categories = ["compilers", "development-tools", "parser-implementations"]
exclude = [".github/", ".cursor/"]

[lib]
name = "csharp_to_rust"
path = "src/lib.rs"

[[bin]]
name = "cs2rs"
path = "src/main.rs"

[dependencies]
tree-sitter = "0.25"
tree-sitter-c-sharp = "0.23"
tree-sitter-language = "=0.1.7"
